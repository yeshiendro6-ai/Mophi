<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Telegram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f1f1f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        /* Official Telegram Widget Container */
        .telegram-widget-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        /* Result Display Area */
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef6ff;
            border-radius: 8px;
            display: none; /* Hidden by default */
            text-align: left;
        }

        .result-item {
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        .label {
            font-weight: bold;
            color: #2481cc;
        }

        .btn-send {
            background-color: #2481cc;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            font-size: 14px;
        }

        .btn-send:hover {
            background-color: #2073b6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Telegram Login</h2>
    <p>Click below to login securely with Telegram.</p>
    
    <!-- 
      1. Replace 'your_bot_username' with your actual bot username (no @).
         Example: if your bot is @MySuperBot, put MySuperBot
    -->
    <div class="telegram-widget-container">
        <a href="#" 
           class="telegram-login" 
           data-telegram-login="YOUR_BOT_USERNAME" 
           data-size="medium" 
           data-onauth="onTelegramAuth" 
           data-request-access="write">
        </a>
    </div>

    <!-- This area will show the data after login -->
    <div id="result">
        <div class="result-item"><span class="label">Name:</span> <span id="user-name"></span></div>
        <div class="result-item"><span class="label">Username:</span> <span id="user-username"></span></div>
        <div class="result-item"><span class="label">Phone:</span> <span id="user-phone"></span></div>
        <div class="result-item"><span class="label">ID:</span> <span id="user-id"></span></div>
        
        <button class="btn-send" onclick="sendToBot()">Send Data to My Bot</button>
    </div>
</div>

<script>
    // Load the official Telegram Login Script
    function onTelegramAuth(user) {
        // This function is called when the user successfully logs in
        console.log("User Authenticated:", user);

        // Display the data on the page
        document.getElementById('user-name').innerText = user.first_name + ' ' + (user.last_name || '');
        document.getElementById('user-username').innerText = user.username || 'N/A';
        document.getElementById('user-phone').innerText = user.phone_number || 'N/A';
        document.getElementById('user-id').innerText = user.id;

        // Show the result box and the send button
        document.getElementById('result').style.display = 'block';
        
        // Store user data globally for the send function
        window.authUser = user;
    }

    // Function to send the captured data to YOUR Telegram Bot
    async function sendToBot() {
        if (!window.authUser) return;

        const BOT_TOKEN = '8893817787:AAGrvjQExlWWfZ6kRvI_BzjIOku2TmF1-VM'; // Replace with your Token
        const CHAT_ID = '8893817787';     // Replace with your Chat ID

        const message = `
🔐 *New Telegram Login*

👤 Name: ${window.authUser.first_name} ${window.authUser.last_name || ''}
🆔 Username: @${window.authUser.username || 'N/A'}
📱 Phone: ${window.authUser.phone_number || 'N/A'}
🔑 ID: ${window.authUser.id}
        `;

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            const data = await response.json();
            if (data.ok) {
                alert("Data sent to your Telegram Bot!");
            } else {
                alert("Error sending data: " + data.description);
            }
        } catch (error) {
            console.error(error);
            alert("Network error.");
        }
    }
</script>

<!-- 
  IMPORTANT: Replace 'YOUR_BOT_USERNAME' in the HTML above with your actual bot username.
  Example: <a ... data-telegram-login="MyBot" ...>
-->

</body>
</html>
