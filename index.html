
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login with Telegram</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f1f1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px #0000001a;
      text-align: center;
      width: min(320px, calc(100% - 60px));
    }

    h2 { color: #333; }

    .telegram-widget-container {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #eef6ff;
      border-radius: 8px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .result-item {
      margin-bottom: 8px;
      font-size: 14px;
      color: #555;
    }

    .label {
      font-weight: bold;
      color: #2481cc;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>Telegram Login</h2>
    <p>Sign in using Telegram to view your profile.</p>

    <div class="telegram-widget-container">
      <script async
        src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="maomephishing_bot"
        data-size="large"
        data-onauth="onTelegramAuth(user)"
        data-request-access="write">
      </script>
    </div>

    <div id="result" aria-live="polite">
      <div class="result-item">
        <span class="label">Name:</span>
        <span id="user-name"></span>
      </div>
      <div class="result-item">
        <span class="label">Username:</span>
        <span id="user-username"></span>
      </div>
      <div class="result-item">
        <span class="label">Telegram ID:</span>
        <span id="user-id"></span>
      </div>
      <p>Only profile information supplied by Telegram is displayed.</p>
    </div>
  </main>

  <script>
    function onTelegramAuth(user) {
      if (!user || !user.id || !user.hash || !user.auth_date) {
        alert("Login information is incomplete.");
        return;
      }

      document.getElementById("user-name").textContent =
        [user.first_name, user.last_name]
          .filter(Boolean).join(" ");

      document.getElementById("user-username").textContent =
        user.username ? "@" + user.username : "Not provided";

      document.getElementById("user-id").textContent =
        String(user.id);

      document.getElementById("result").style.display = "block";

      // Send authentication data to your backend for verification
      // before treating this person as an authenticated user.
      console.log("Telegram login callback received.");
    }
  </script>
</body>
</html>
